<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102f50">
<title>チケドロ！｜先着販売トレーニング</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172331;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",Arial,sans-serif}.app{max-width:650px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 35px #0001}.top,.salehead{background:linear-gradient(135deg,#102f50,#245f8d);color:#fff;padding:15px 19px}.brand{font-size:20px;font-weight:900}.brand small{font-size:11px;opacity:.7;margin-left:7px}.hero{min-height:440px;padding:45px 24px;color:#fff;background:linear-gradient(145deg,#102f50,#1e5888 60%,#2d729d);display:flex;flex-direction:column;justify-content:center}.hero .k{font-size:11px;letter-spacing:.18em;font-weight:800;opacity:.7}.hero h1{font-size:39px;line-height:1.1;margin:14px 0}.hero h1 span{display:block;font-size:18px;font-weight:500;margin-top:10px;opacity:.85}.hero p{font-size:14px;line-height:1.9;color:#fffc;margin:0 0 28px}.start{max-width:270px;padding:16px;border:0;border-radius:9px;background:#fff;color:#102f50;font-weight:900;font-size:16px}.features{padding:20px}.ft{padding:14px 0;border-bottom:1px solid #e1e6eb}.ft b{font-size:14px}.ft p{margin:4px 0 0;color:#6b7784;font-size:12px}.footer{text-align:center;padding:18px;color:#7a8490;font-size:11px;border-top:1px solid #e0e5ea}.page{padding:25px 17px 38px}.eyebrow{font-size:11px;color:#2e70a9;font-weight:900;letter-spacing:.13em}.page h1{font-size:25px;margin:6px 0}.notice{max-height:58vh;overflow:auto;border:1px solid #dfe5eb;border-radius:13px;padding:19px;box-shadow:0 2px 8px #00000008}.notice h2{font-size:16px}.notice h3{font-size:14px;margin-top:20px}.notice p,.notice li{font-size:13px;line-height:1.8;color:#4e5b68}.agree{display:flex;gap:9px;padding:13px;margin-top:15px;border:1px solid #dfe5eb;border-radius:9px;font-size:13px;font-weight:700}.agree input{width:18px;height:18px;accent-color:#c93434}.btn{width:100%;padding:14px;border:0;border-radius:8px;background:#c93434;color:#fff;font-weight:900;margin-top:12px}.btn:disabled{opacity:.4}.wait{text-align:center;padding:65px 18px}.count{font-size:70px;font-weight:950;color:#102f50;margin:14px 0}.muted{color:#697684;font-size:12px}.salehead{padding:13px 18px}.salehead b{font-size:17px}.salehead small{display:block;opacity:.7;margin-top:3px}.main{padding:18px 16px}.card{padding:19px;border:1px solid #dfe5eb;border-radius:13px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.sale{display:inline-block;background:#c93434;color:#fff;padding:5px 9px;border-radius:4px;font-size:11px;font-weight:900}.eventtitle{font-size:20px;font-weight:900;margin:10px 0 5px}.small{font-size:12px;color:#697684}.box{display:block;width:100%;padding:15px;border:1px solid #ccd5de;background:#fff;border-radius:9px;text-align:left;margin-top:10px}.ticket{font-weight:900}.price{font-size:18px;font-weight:950;margin-top:5px}.progress{background:#102f50;color:white;padding:13px 17px}.dots{display:flex;align-items:center;margin-top:9px}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#ffffff15;border:1px solid #ffffff44;font-size:10px}.dot.on{background:#fff;color:#102f50}.dot.done{background:#86acd0}.line{height:2px;flex:1;background:#ffffff35;margin:0 6px}.line.done{background:#a6cbe8}.field{margin:14px 0}label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input[type=text],input[type=email]{width:100%;padding:13px;border:1px solid #c7d0da;border-radius:7px}.info{background:#eef5fb;border:1px solid #c8dbea;border-radius:8px;padding:11px;font-size:13px;line-height:1.7}.radio{display:flex;gap:9px;padding:12px;border:1px solid #dfe5eb;border-radius:8px;margin:8px 0}.sorry{text-align:center;padding:80px 24px;min-height:100vh}.sorrymark{font-size:43px;font-weight:950;letter-spacing:.12em;color:#102f50}.redline{width:42px;height:3px;background:#c93434;margin:18px auto 25px}.sorry h1{font-size:22px}.lead{font-size:16px;font-weight:900;line-height:1.8}.explain{font-size:13px;color:#697684;line-height:1.8}.retry{max-width:300px}.code{font-size:11px;color:#a0a9b2;margin-top:25px}.done{text-align:center;padding:35px 15px}.record{background:#f6f8fa;padding:15px;border-radius:10px;text-align:left}.record div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e1e5ea}.record div:last-child{border:0}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const A=document.getElementById("app"),K="tiketTrainingState";let t=null;
let s={page:"home",email:"",email2:"",last:"",first:"",lastKana:"",firstKana:"",actions:0};
function save(){sessionStorage.setItem(K,JSON.stringify(s))}
function load(){try{s=Object.assign(s,JSON.parse(sessionStorage.getItem(K)||"{}"))}catch(e){}}
function stop(){if(t){clearInterval(t);t=null}}
function reset(){stop();sessionStorage.removeItem(K);s={page:"home",email:"",email2:"",last:"",first:"",lastKana:"",firstKana:"",actions:0};history.replaceState({},'',location.pathname);render()}
function go(p){s.page=p;s.actions++;save();history.pushState({},'',location.pathname+"#"+p);render()}
function render(){stop();({home,notice,wait,event,tickets,info,payment,finalPage,done,sorry}[s.page]||home)()}
function home(){A.innerHTML=`<div class="top"><div class="brand">🎫 チケドロ！ <small>TRAINING</small></div></div><section class="hero"><div class="k">FIRST-COME, FIRST-SERVED</div><h1>先着販売<br>トレーニング<span>本番さながらの緊張感で、先着販売を練習。</span></h1><p>販売開始からアクセス集中、ページ遷移、エラーまでを想定した架空の先着販売トレーニングです。</p><button class="start" onclick="go('notice')">販売開始ページへ　›</button></section><section class="features"><div class="ft"><b>01　販売開始を待つ</b><p>カウントダウン終了と同時に販売ページへ。</p></div><div class="ft"><b>02　アクセス集中を体験</b><p>先着販売ならではのエラーも再現します。</p></div><div class="ft"><b>03　焦らず操作する</b><p>表示された画面を確認しながら進めましょう。</p></div></section><div class="footer">チケドロ！｜先着販売トレーニング</div>`}
function notice(){A.innerHTML=`<div class="top"><div class="brand">🎫 チケドロ！ <small>TRAINING</small></div></div><main class="page"><div class="eyebrow">IMPORTANT NOTICE</div><h1>練習を始める前に</h1><p class="small">注意事項を最後まで確認してください。</p><div class="notice" id="ns"><h2>このサイトについて</h2><p>このサイトは架空のチケット販売を想定した「先着販売トレーニング」です。実在する販売サービスではありません。</p><h3>実際の販売とは異なります</h3><p>画面、URL、操作方法、アクセス集中の発生方法などは練習のために独自に再現しています。</p><h3>個人情報について</h3><p>実在するメールアドレスや氏名は入力しないでください。練習中は画面に表示される架空の情報を使用してください。</p><h3>練習結果について</h3><p>購入成功・エラー等はすべて架空の結果です。実際のチケット取得を保証するものではありません。</p><h3>その他</h3><ul><li>特定の企業・販売事業者とは関係ありません。</li><li>実在する公演・会場・アーティストとは関係ありません。</li><li>練習中は画面の案内に従ってください。</li></ul><p><b>以上を確認したうえで練習を開始してください。</b></p></div><p class="small" style="text-align:center">注意事項を下までスクロールしてください</p><label class="agree"><input type="checkbox" id="ag" disabled> 注意事項を確認し、同意します。</label><button class="btn" id="ab" disabled>同意してスタート</button></main>`;let n=document.getElementById("ns"),ag=document.getElementById("ag"),b=document.getElementById("ab");n.onscroll=()=>{if(n.scrollTop+n.clientHeight>=n.scrollHeight-8)ag.disabled=false};ag.onchange=()=>b.disabled=!ag.checked;b.onclick=()=>go("wait")}
function wait(){A.innerHTML=`<div class="top"><div class="brand">🎫 チケドロ！ <small>先着販売</small></div></div><main class="wait"><div class="waitTitle">販売開始まで</div><div class="count" id="c">00:15</div><div class="muted">販売開始と同時にページが切り替わります</div></main>`;let end=Date.now()+15000;t=setInterval(()=>{let d=end-Date.now(),q=Math.max(0,Math.ceil(d/1000)),e=document.getElementById("c");if(e)e.textContent="00:"+String(q).padStart(2,"0");if(d<=0){stop();startSale()}},100)}
function startSale(){if(Math.random()<.86)return showSorry("アクセスが集中しています","販売開始直後からアクセスが集中しているため、ページを表示できませんでした。");go("event")}
function head(){return`<div class="salehead"><b>チケドロ！</b><small>先着販売　/　チケット購入</small></div>`}
function event(){A.innerHTML=head()+`<main class="main"><div class="card"><div class="small">7777年 7月7日</div><span class="sale">発売中</span><div class="eventtitle">チケドロツアー IN 架空販売</div><div class="small">チケドロアリーナ（チケドロ県）</div><button class="box" onclick="openTickets()"><b>7777年7月7日</b><span style="float:right">›</span><div class="small" style="margin-top:8px">開場 16:00　開演 18:00</div></button></div></main>`}
function openTickets(){if(Math.random()<.75)return showSorry("ページを表示できませんでした","アクセス集中により、販売情報を取得できませんでした。");go("tickets")}
function tickets(){A.innerHTML=head()+`<main class="main"><div class="card"><div class="small">7777年7月7日 / 開演 18:00</div><h2>席種を選択してください</h2><button class="box" onclick="selectTicket('全席指定（1名券）')"><span class="ticket">全席指定（1名券）</span><span style="float:right">›</span><div class="price">￥10,000</div></button><button class="box" onclick="selectTicket('全席指定（2名券）')"><span class="ticket">全席指定（2名券）</span><span style="float:right">›</span><div class="price">￥20,000</div></button></div></main>`}
function selectTicket(x){s.selected=x;s.actions++;save();if(Math.random()<.98)return showSorry("手続きを続けられません","アクセス集中により、チケットの確保処理を完了できませんでした。");go("info")}
function prog(x){let z=["お客様情報","決済・取引","最終確認","完了"];return`<div class="progress"><div style="font-size:11px;opacity:.8">購入手続き　　${x+1} / 4</div><div class="dots">${z.map((_,i)=>`<div class="dot ${i<x?"done":""} ${i==x?"on":""}">${i==3?"✓":i+1}</div>${i<3?`<div class="line ${i<x?"done":""}"></div>`:""}`).join("")}</div></div>`}
function fld(l,id,p,t="text"){return`<div class="field"><label>${l}</label><input id="${id}" type="${t}" placeholder="${p}" value="${s[id]||""}"></div>`}
function info(){A.innerHTML=prog(0)+`<main class="main"><div class="card"><div class="info">練習用情報：メール <b>ABC</b> / 氏名 <b>架空 太郎</b>（カクウ タロウ）</div>${fld("メールアドレス","email","ABC","email")}${fld("メールアドレス確認用","email2","ABC","email")}<h3>氏名</h3><div class="row">${fld("姓","last","架空")}${fld("名","first","太郎")}</div><h3>フリガナ</h3><div class="row">${fld("セイ","lastKana","カクウ")}${fld("メイ","firstKana","タロウ")}</div><button class="btn" onclick="nextInfo()">次へ進む</button></div></main>`;["email","email2","last","first","lastKana","firstKana"].forEach(i=>document.getElementById(i).oninput=e=>{s[i]=e.target.value;save()})}
function nextInfo(){if(!["email","email2","last","first","lastKana","firstKana"].every(k=>s[k].trim())||s.email.toUpperCase()!="ABC"||s.email2.toUpperCase()!="ABC")return alert("練習用の指定情報を入力してください。");go("payment")}
function payment(){A.innerHTML=prog(1)+`<main class="main"><div class="card"><h2>決済・取引方法の選択</h2><div class="radio">◉　店頭</div><div class="radio">◉　コンビニ決済</div><button class="btn" onclick="go('final')">次へ進む</button></div></main>`}
function finalPage(){A.innerHTML=prog(2)+`<main class="main"><div class="card"><h2>注意事項への同意</h2><div class="info"><b>[必須] 転売の禁止</b><br>転売を目的としたチケットの購入は禁止されています。</div><label class="agree"><input type="checkbox" class="fc"> 同意する</label><div class="info"><b>[必須] 会場内の撮影</b><br>指定された場所以外での撮影は禁止されています。</div><label class="agree"><input type="checkbox" class="fc"> 同意する</label><button class="btn" id="fin" disabled>購入を確定する</button></div></main>`;let c=[...document.querySelectorAll(".fc")],b=document.getElementById("fin");c.forEach(x=>x.onchange=()=>b.disabled=!c.every(y=>y.checked));b.onclick=()=>go("done")}
function done(){A.innerHTML=prog(3)+`<main class="main"><div class="card done"><div style="font-size:54px">🎉</div><h1>購入完了</h1><p>チケットの購入手続きが完了しました。</p><div class="record"><b>今回の練習記録</b><div><span>画面操作回数</span><b>${s.actions}回</b></div><div><span>結果</span><b>購入成功</b></div></div><button class="btn" onclick="reset()">もう一度練習する</button></div></main>`}
function showSorry(t,m){stop();s.page="sorry";s.actions++;save();history.pushState({},'',location.pathname+"#sorry");sorry(t,m)}
function sorry(t,m){A.innerHTML=`<main class="sorry"><div class="sorrymark">SORRY</div><div class="redline"></div><h1>${t||"やり直してください"}</h1><p class="lead">前のページに戻るか、もう一度やり直してください。</p><p class="explain">${m||"アクセスが集中しているため、手続きを続けることができませんでした。"}<br>先着販売では、アクセスが集中するとページを正常に表示できないことがあります。</p><button class="btn retry" onclick="reset()">更新する</button><div class="code">ERROR CODE　TD-503</div></main><div class="footer">チケドロ！｜先着販売トレーニング</div>`}
window.onpopstate=()=>{s.page=location.hash.slice(1)||"home";save();render()};load();render();
</script>
</body></html>
